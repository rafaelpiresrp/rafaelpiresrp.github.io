<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Finance by Rafael Pires.">
  <title>Finance | Rafael Pires</title>
  <style>:root{
  --green:#213024;
  --green-deep:#172119;
  --ink:#ece4d3;
  --muted:#aea78f;
  --brown:#a8693a;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--green);color:var(--ink);font:1rem/1.75 var(--sans)}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-decoration-color:var(--brown);text-underline-offset:.3em;text-decoration-thickness:1px}
a:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
h1,h2,h3,p{margin-top:0}
h1{font:400 clamp(2.6rem,5vw,3.8rem)/1.1 var(--serif);letter-spacing:-.03em;margin-bottom:2.5rem}
.skip-link{position:absolute;top:-8rem;left:1rem;padding:.5rem 1rem;background:var(--green-deep)}
.skip-link:focus{top:1rem}

/* Home */
.home-main{flex:1;display:grid;grid-template-columns:auto 1fr;min-height:100vh;min-height:100svh}
.home-figure{margin:0;height:100vh;height:100svh;position:sticky;top:0}
.home-figure img{display:block;height:100%;width:auto;max-width:62vw;object-fit:cover;object-position:70% center}
.home-panel{display:flex;flex-direction:column;justify-content:center;padding:4rem clamp(2rem,5vw,5.5rem)}
.home h1{white-space:nowrap;font-size:clamp(2.8rem,4.6vw,5.5rem);line-height:1.02;letter-spacing:-.045em;margin:0 0 3rem}
.home h1 span{color:var(--brown)}
.home-nav{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem}
.home-nav a{font:400 1.5rem/1.6 var(--serif)}
.home-foot{margin-top:4rem;font-size:.75rem;line-height:1.6;color:var(--muted)}
.home-foot p{margin:0}

/* Inner pages */
.site-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.5rem 2rem;width:calc(100% - 4rem);max-width:60rem;margin:0 auto;padding:2rem 0}
.wordmark{font:400 1.5rem/1.2 var(--serif);letter-spacing:-.02em}
.header-nav{display:flex;flex-wrap:wrap;gap:.25rem 2rem;font-size:.9rem;color:var(--muted)}
.header-nav a[aria-current="page"]{color:var(--ink)}
.page-main{flex:1;width:calc(100% - 4rem);max-width:60rem;margin:0 auto;padding:3.5rem 0 5rem}

.about-copy{max-width:38rem}
.about-copy p{font-size:1.1rem;line-height:1.85;margin-bottom:1.4rem}

.research-areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3rem}
.research-areas h2{font:400 2rem/1.25 var(--serif);margin:0 0 1rem}
.area-topics{display:flex;flex-direction:column;gap:.2rem;color:var(--muted)}
.area-topics a:hover{color:var(--ink)}

.archive-heading{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:1rem 2rem;margin-bottom:2rem}
.archive-heading h1{margin:0}
.area-switch,.section-tabs{display:flex;flex-wrap:wrap;gap:.25rem 1.75rem;font-size:.95rem;color:var(--muted)}
.area-switch a[aria-current="page"],.section-tabs a[aria-current="location"]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--brown);text-underline-offset:.3em;text-decoration-thickness:1px}
.section-tabs{margin-bottom:2.5rem}
.publication{margin-bottom:2.5rem}
.publication time{font-size:.8rem;color:var(--muted)}
.publication h3{font:400 clamp(1.4rem,2.6vw,1.75rem)/1.3 var(--serif);margin:.2rem 0 .4rem;max-width:44rem}
.publication p{color:var(--muted);max-width:42rem;margin:0}
.empty{color:var(--muted)}

.article-main{max-width:44rem}
.article-header{margin-bottom:2.5rem}
.article-header h1{margin-bottom:1rem}
.article-byline{font-size:.85rem;color:var(--muted)}
.article-body{font-size:1.1rem;line-height:1.85}
.article-body p{margin-bottom:1.4rem}
.article-body h2{font:400 1.7rem/1.35 var(--serif);margin:2.6rem 0 1rem}
.article-body figure{margin:2rem 0}
.article-body img{display:block;max-width:100%;height:auto}
.article-body figcaption{color:var(--muted);font-size:.85rem;padding-top:.6rem}
.article-body blockquote{margin:2rem 0;padding-left:1.5rem;border-left:2px solid var(--brown);font:1.3rem/1.6 var(--serif)}
.article-back{margin-top:3rem;font-size:.9rem;color:var(--muted)}

.site-footer{width:calc(100% - 4rem);max-width:60rem;margin:0 auto;padding:2rem 0;font-size:.75rem;color:var(--muted)}
.site-footer p{margin:0}
[hidden]{display:none!important}

@media(max-width:760px){
  .home-main{grid-template-columns:1fr}
  .home-figure{position:static;height:52svh}
  .home-figure img{width:100%;max-width:none;object-position:center 30%}
  .home-panel{padding:2.5rem 1.75rem 2rem}
  .home h1{margin-bottom:2rem}
  .home-nav a{font-size:1.3rem}
  .home-foot{margin-top:2.5rem}
  .site-header,.page-main,.site-footer{width:calc(100% - 3rem)}
  .site-header{padding:1.25rem 0}
  .page-main{padding-top:2rem}
  .research-areas{grid-template-columns:1fr;gap:2.25rem}
  .archive-heading{flex-direction:column}
}
@media print{
  body{background:#fff;color:#000}
  .site-header,.site-footer,.skip-link,.article-back,.area-switch{display:none}
}
</style>
</head>
<body>
  <a class="skip-link" href="#conteudo">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="index.html">Rafael Pires</a>
    <nav aria-label="Main navigation" class="header-nav">
      <a href="sobre.html">About</a>
      <a href="research.html">Research &amp; Topics of Interest</a>
    </nav>
  </header>
  <main id="conteudo" class="page-main" data-archive="finance">
    <div class="archive-heading">
      <h1>Finance</h1>
      <nav class="area-switch" aria-label="Research areas">
        <a href="economics.html" data-area="economics">Economics</a>
        <a href="finance.html" data-area="finance" aria-current="page">Finance</a>
      </nav>
    </div>
    <nav class="section-tabs" aria-label="Publication types">
      <a href="#letters" data-type="letters" aria-current="location" aria-controls="publication-list">Letters</a>
      <a href="#working_papers" data-type="working_papers" aria-controls="publication-list">Working papers</a>
      <a href="#what_if" data-type="what_if" aria-controls="publication-list">What if?</a>
    </nav>
    <section class="publication-list" id="publication-list" data-publications aria-label="Letters" aria-live="polite"></section>
  </main>
  <footer class="site-footer"><p>© 2026 Rafael Pires</p></footer>
  <script src="publicacoes.js"></script>
  <script>(() => {
  "use strict";
  const archive = document.querySelector("[data-archive]");
  if (!archive) return;
  const list = archive.querySelector("[data-publications]");
  const links = [...archive.querySelectorAll("[data-type]")];
  const typeLabels = {letters: "Letters", working_papers: "Working papers", what_if: "What if?"};
  const all = Array.isArray(window.PUBLICACOES) ? window.PUBLICACOES : [];
  const items = all.filter(item => item &&
    typeof item.titulo === "string" &&
    item.area === archive.dataset.archive &&
    Object.prototype.hasOwnProperty.call(typeLabels, item.tipo || "letters") &&
    typeof item.data === "string" && /^\d{4}-\d{2}-\d{2}$/.test(item.data) &&
    typeof item.arquivo === "string" && /^[a-zA-Z0-9_./-]+\.html$/.test(item.arquivo) &&
    !item.arquivo.includes("..") && !item.arquivo.startsWith("/")
  ).sort((a, b) => b.data.localeCompare(a.data));
  const formatter = new Intl.DateTimeFormat("en-GB", {day: "numeric", month: "long", year: "numeric", timeZone: "UTC"});
  function render() {
    const hash = location.hash.slice(1);
    const type = Object.prototype.hasOwnProperty.call(typeLabels, hash) ? hash : "letters";
    for (const link of links) {
      if (link.dataset.type === type) link.setAttribute("aria-current", "location");
      else link.removeAttribute("aria-current");
    }
    for (const link of archive.querySelectorAll("[data-area]")) link.href = link.dataset.area + ".html#" + type;
    list.replaceChildren();
    list.setAttribute("aria-label", typeLabels[type]);
    const subset = items.filter(entry => (entry.tipo || "letters") === type);
    if (!subset.length) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Nothing published here yet.";
      list.append(empty);
      return;
    }
    for (const item of subset) {
      const article = document.createElement("article");
      article.className = "publication";
      const time = document.createElement("time");
      time.dateTime = item.data;
      const date = new Date(item.data + "T12:00:00Z");
      time.textContent = Number.isNaN(date.getTime()) ? item.data : formatter.format(date);
      const heading = document.createElement("h3");
      const link = document.createElement("a");
      link.href = item.arquivo;
      link.textContent = item.titulo;
      heading.append(link);
      article.append(time, heading);
      if (typeof item.resumo === "string" && item.resumo.trim()) {
        const summary = document.createElement("p");
        summary.textContent = item.resumo;
        article.append(summary);
      }
      list.append(article);
    }
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
